# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
# Python policy: minimum supported (3.12), latest fully released (3.14), upcoming pre-release (3.15).
envlist = py312,py314,py315,pypy3,ruff
skip_missing_interpreters = true

[testenv]
deps = pytest>=6.2.0
commands = pytest {posargs:tests}

[testenv:ruff]
skip_install = true
deps = ruff
commands =
    ruff check src tests
    ruff format --check src tests
