# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py312,py315,pypy3,ruff
skip_missing_interpreters = true

[testenv]
deps = pytest>=6.2.0
commands = pytest {posargs:tests}

[testenv:py315]
# PySide6 6.11 caps requires-python at <3.15, but its abi3 wheels run fine on 3.15
# (verified on 3.15.0b2). Drop the override once a PySide6 release declares 3.15 support.
install_command = python -I -m pip install --ignore-requires-python {opts} {packages}

[testenv:ruff]
skip_install = true
deps = ruff
commands =
    ruff check src tests
    ruff format --check src tests
